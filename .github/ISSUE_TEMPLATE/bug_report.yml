name: Bug report
description: Something is broken or wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A share link (Copy link button) helps a lot.
  - type: dropdown
    id: platform
    attributes:
      label: Where
      options: [Website (desktop), Website (phone), Installed PWA, Android app]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown at the bottom of "About & data".
