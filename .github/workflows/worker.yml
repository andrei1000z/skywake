name: Deploy API worker

on:
  push:
    branches: [main]
    paths: ['apps/worker/**', 'packages/shared/**', '.github/workflows/worker.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else
          echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping deploy (see docs/DEPLOYMENT.md)."; echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.creds.outputs.ok == 'true'
        uses: actions/checkout@v5
      - if: steps.creds.outputs.ok == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.creds.outputs.ok == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - if: steps.creds.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile && pnpm --filter @skywake/worker test
      - if: steps.creds.outputs.ok == 'true'
        name: Deploy
        working-directory: apps/worker
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: steps.creds.outputs.ok == 'true' && vars.SKYWAKE_API_BASE != ''
        name: Smoke test deployed API
        run: |
          curl -fsS "${{ vars.SKYWAKE_API_BASE }}/v1/health" | tee /dev/stderr | grep -q '"service":"skywake-api"'
